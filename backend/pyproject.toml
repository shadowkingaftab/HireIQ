[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "proofhire-backend"
version = "0.1.0"
description = "ProofHire backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.3.6",
    "redis>=5.1.1",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "aiofiles>=24.1.0",
    "httpx>=0.27.2",
    "openai>=1.52.0",
    "anthropic>=0.37.1",
    "boto3>=1.35.54",
    "pyclamd>=0.4.4",
    "prometheus-client>=0.21.0",
    "opentelemetry-api>=1.28.2",
    "opentelemetry-sdk>=1.28.2",
    "opentelemetry-exporter-otlp>=1.28.2",
    "jinja2>=3.1.4",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=5.0.0",
    "faker>=30.0.0",
    "factory-boy>=3.3.1",
    "black>=24.8.0",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
exclude = [
    "app/models_backup/**",
    "app/models_before_bulk_repair_20260821_223457/**",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
exclude = "(?x)(^backend/app/models_backup/|^backend/app/models_before_bulk_repair_20260821_223457/|^backend/tests/)"

[[tool.mypy.overrides]]
module = ["boto3.*", "clamd", "deprecated.*", "jose", "jose.*", "passlib.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
