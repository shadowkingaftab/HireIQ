services:
  - type: web
    name: proofhire-api
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn proofhire.backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: proofhire-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: proofhire-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

  - type: redis
    name: proofhire-redis
    plan: free

  - type: postgres
    name: proofhire-db
    plan: free
